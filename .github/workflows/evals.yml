name: Evals

# The plugin's eval cases (plugins/stackfoundry/evals/), run on demand only: every case runs real `claude -p`
# sessions, with and without the plugin, and spends tokens on the owner's account. Never on push or pull request.
# Needs the repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`); the job stops at once without it.
on:
  workflow_dispatch:
    inputs:
      max_cost_usd:
        description: "Hard cost ceiling for each eval command, in USD (list-price estimate)"
        default: "5"
        required: true
      runs:
        description: "Runs per case (1 to look, 3 before a release)"
        default: "1"
        required: true

permissions:
  contents: read

concurrency:
  group: evals
  cancel-in-progress: false

jobs:
  evals:
    name: Read-only cases and the guard case
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      MAX_COST_USD: ${{ inputs.max_cost_usd }}
      RUNS: ${{ inputs.runs }}
    steps:
      - name: The token is set
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "::error::Add the repository secret CLAUDE_CODE_OAUTH_TOKEN (claude setup-token) to run the evals."
            exit 1
          fi
      - name: The inputs are numbers
        run: |
          case "$MAX_COST_USD" in ''|*[!0-9.]*) echo "::error::max_cost_usd must be a number"; exit 1 ;; esac
          case "$RUNS" in ''|*[!0-9]*) echo "::error::runs must be a whole number"; exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - name: Install Claude Code CLI
        # The same pin as CI (ci.yml): a CLI release cannot change what a case means between two runs.
        run: npm install -g @anthropic-ai/claude-code@2.1.319
      - name: Read-only cases
        # Score below 1.0 is a result to read, not a job failure (--threshold 0); the report and JSON are the output.
        working-directory: plugins/stackfoundry
        run: >-
          claude plugin eval . --scaffold --trust-plugin --no-publish --runs "$RUNS" --max-cost-usd "$MAX_COST_USD"
          --threshold 0 --tag read-only --json evals/results/read-only.json --report evals/results/read-only.html
      - name: Guard case
        # Edit and Write are granted, so file-untouched proves the hook denied the edit, not that Edit was missing.
        working-directory: plugins/stackfoundry
        run: >-
          claude plugin eval . --scaffold --trust-plugin --no-publish --runs "$RUNS" --max-cost-usd "$MAX_COST_USD"
          --threshold 0 --case guard-blocks-generated-edit --allow-tools Edit Write
          --json evals/results/guard.json --report evals/results/guard.html
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: plugins/stackfoundry/evals/results/
          if-no-files-found: warn
